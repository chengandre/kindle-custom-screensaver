name: Build KindleHF binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build native binaries for kindlehf
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            bison \
            flex \
            gawk \
            libtool \
            libtool-bin \
            libncurses-dev \
            curl \
            file \
            git \
            gperf \
            help2man \
            texinfo \
            unzip \
            wget \
            sed \
            jq \
            libarchive-dev \
            nettle-dev \
            meson \
            ninja-build \
            pkg-config

      - name: Install KindleHF toolchain
        run: |
          wget \
            -O "$RUNNER_TEMP/kindlehf.tar.gz" \
            "https://github.com/KindleModding/koxtoolchain/releases/download/2026.04/kindlehf.tar.gz"

          echo \
            "d08d3a5cbbaa184cc0cc2279df1d64a71656ab2c1e0223cae324b8d30c8d73e0  $RUNNER_TEMP/kindlehf.tar.gz" \
            | sha256sum -c -

          tar -xzf "$RUNNER_TEMP/kindlehf.tar.gz" \
            -C "$HOME"

          test -d "$HOME/x-tools/arm-kindlehf-linux-gnueabihf"

      - name: Clone Kindle SDK
        run: |
          git clone \
            --recursive \
            --depth=1 \
            https://github.com/KindleModding/kindle-sdk.git \
            "$RUNNER_TEMP/kindle-sdk"

      - name: Configure Kindle SDK
        working-directory: ${{ runner.temp }}/kindle-sdk
        run: |
          chmod +x ./gen-sdk.sh
          ./gen-sdk.sh kindlehf

      - name: Configure Meson for kindlehf
        run: |
          CROSS_FILE="$HOME/x-tools/arm-kindlehf-linux-gnueabihf/meson-crosscompile.txt"

          test -f "$CROSS_FILE"

          meson setup \
            --cross-file "$CROSS_FILE" \
            build-kindlehf

      - name: Compile
        run: |
          meson compile -C build-kindlehf

      - name: Collect binary
        run: |
          BINARY="$(find build-kindlehf \
            -type f \
            -name screensaver_shield \
            -perm -111 \
            -print \
            -quit)"

          if [ -z "$BINARY" ]; then
            echo "screensaver_shield was not produced"
            exit 1
          fi

          cp "$BINARY" dist/screensaver_shield

      - name: Inspect binary
        run: |
          echo "=== file ==="
          file dist/screensaver_shield

          echo
          echo "=== ELF header ==="
          readelf -h dist/screensaver_shield

          echo
          echo "=== interpreter ==="
          readelf -l dist/screensaver_shield | grep interpreter || true

          echo
          echo "=== dynamic dependencies ==="
          readelf -d dist/screensaver_shield | grep NEEDED || true

      - name: Checkout FBInk
        run: |
          git clone \
            https://github.com/NiLuJe/FBInk.git \
            "$RUNNER_TEMP/FBInk"

          git -C "$RUNNER_TEMP/FBInk" \
            checkout ede0a8d0a107768609fde9a68aab5f5c583be398

          git -C "$RUNNER_TEMP/FBInk" \
            submodule update --init --recursive

      - name: Build FBInk for KindleHF
        run: |
          TOOLCHAIN="$HOME/x-tools/arm-kindlehf-linux-gnueabihf/bin/arm-kindlehf-linux-gnueabihf"

          make -C "$RUNNER_TEMP/FBInk" distclean

          make -C "$RUNNER_TEMP/FBInk" \
            strip \
            KINDLE=1 \
            CROSS_TC="$TOOLCHAIN" \
            -j"$(nproc)"

          cp \
            "$RUNNER_TEMP/FBInk/Release/fbink" \
            dist/fbink_hf

      - name: Inspect FBInk binary
        run: |
          echo "=== file ==="
          file dist/fbink_hf

          echo
          echo "=== ELF header ==="
          readelf -h dist/fbink_hf

          echo
          echo "=== interpreter ==="
          readelf -l dist/fbink_hf | grep interpreter || true

          echo
          echo "=== dynamic dependencies ==="
          readelf -d dist/fbink_hf | grep NEEDED || true

      - name: Record dependency revisions
        run: |
          {
            echo "project_commit=${GITHUB_SHA}"
            echo "toolchain_repo=KindleModding/koxtoolchain"
            echo "toolchain_release=2026.04"
            echo "toolchain_sha256=d08d3a5cbbaa184cc0cc2279df1d64a71656ab2c1e0223cae324b8d30c8d73e0"
            echo "kindle_sdk_commit=$(git -C "$RUNNER_TEMP/kindle-sdk" rev-parse HEAD)"
            echo "fbink_commit=$(git -C "$RUNNER_TEMP/FBInk" rev-parse HEAD)"
          } | tee dist/build-metadata.txt

      - name: Determine package version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! printf '%s\n' "$GITHUB_REF_NAME" \
              | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
            then
              echo "::error::Unsupported release tag '$GITHUB_REF_NAME'. KPM release tags must use vMAJOR.MINOR.PATCH with three numeric components."
              exit 1
            fi

            VERSION="${GITHUB_REF_NAME#v}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package release artifacts
        run: |
          ./scripts/package-zip.sh
          ./scripts/package-kpm.sh

      - name: Validate release artifacts
        run: |
          unzip -t \
            "release/custom-screensaver-${VERSION}-kindlehf.zip"

          ./scripts/validate-kpm.sh \
            "release/custom-screensaver_${VERSION}_kindlehf.kpkg" \
            "$VERSION" \
            release/kpm-repository.json

      - name: Upload KindleHF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-screensaver-kindlehf
          path: |
            dist/screensaver_shield
            dist/fbink_hf
            dist/build-metadata.txt
            release/*.zip
            release/*.kpkg
            release/kpm-repository.json

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: custom-screensaver-kindlehf
          path: artifact

      - name: Find release files
        run: |
          ZIP="$(find artifact \
            -type f \
            -name 'custom-screensaver-*-kindlehf.zip' \
            -print \
            -quit)"

          if [ -z "$ZIP" ]; then
            echo "Release ZIP not found"
            exit 1
          fi

          KPKG="$(find artifact \
            -type f \
            -name 'custom-screensaver_*_kindlehf.kpkg' \
            -print \
            -quit)"

          if [ -z "$KPKG" ]; then
            echo "Release KPM package not found"
            exit 1
          fi

          REPOSITORY_MANIFEST="$(find artifact \
            -type f \
            -name 'kpm-repository.json' \
            -print \
            -quit)"

          if [ -z "$REPOSITORY_MANIFEST" ]; then
            echo "KPM repository manifest not found"
            exit 1
          fi

          echo "RELEASE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "RELEASE_KPKG=$KPKG" >> "$GITHUB_ENV"
          echo "REPOSITORY_MANIFEST=$REPOSITORY_MANIFEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        run: |
          gh release create \
            "$GITHUB_REF_NAME" \
            "$RELEASE_ZIP" \
            "$RELEASE_KPKG" \
            "$REPOSITORY_MANIFEST" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kindle Custom Screensaver ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    name: Deploy KPM repository to GitHub Pages
    needs: [build, release]
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: custom-screensaver-kindlehf
          path: artifact

      - name: Prepare GitHub Pages content
        run: |
          REPOSITORY_MANIFEST="$(find artifact \
            -type f \
            -name 'kpm-repository.json' \
            -print \
            -quit)"

          if [ -z "$REPOSITORY_MANIFEST" ]; then
            echo "KPM repository manifest not found"
            exit 1
          fi

          mkdir pages
          cp "$REPOSITORY_MANIFEST" pages/kpm.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

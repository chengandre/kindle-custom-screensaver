name: Build Kindle binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build native binaries for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: kindlehf
            triplet: arm-kindlehf-linux-gnueabihf
            toolchain_sha256: d08d3a5cbbaa184cc0cc2279df1d64a71656ab2c1e0223cae324b8d30c8d73e0
            fbink_name: fbink_hf
          # Soft-float build for older firmware (e.g. Paperwhite 2 on 5.12.x).
          - target: kindlepw2
            triplet: arm-kindlepw2-linux-gnueabi
            toolchain_sha256: ecefcab5ecdedc4e0255440d2aae36dda1efe36ef16bc6934c4633b2be5e69e5
            fbink_name: fbink
    timeout-minutes: 90
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            bison \
            flex \
            gawk \
            libtool \
            libtool-bin \
            libncurses-dev \
            curl \
            file \
            git \
            gperf \
            help2man \
            texinfo \
            unzip \
            wget \
            sed \
            jq \
            libarchive-dev \
            nettle-dev \
            meson \
            ninja-build \
            pkg-config

      - name: Install ${{ matrix.target }} toolchain
        run: |
          wget \
            -O "$RUNNER_TEMP/${{ matrix.target }}.tar.gz" \
            "https://github.com/KindleModding/koxtoolchain/releases/download/2026.04/${{ matrix.target }}.tar.gz"

          echo \
            "${{ matrix.toolchain_sha256 }}  $RUNNER_TEMP/${{ matrix.target }}.tar.gz" \
            | sha256sum -c -

          tar -xzf "$RUNNER_TEMP/${{ matrix.target }}.tar.gz" \
            -C "$HOME"

          test -d "$HOME/x-tools/${{ matrix.triplet }}"

      - name: Clone Kindle SDK
        run: |
          git clone \
            --recursive \
            --depth=1 \
            https://github.com/KindleModding/kindle-sdk.git \
            "$RUNNER_TEMP/kindle-sdk"

      - name: Configure Kindle SDK
        working-directory: ${{ runner.temp }}/kindle-sdk
        run: |
          chmod +x ./gen-sdk.sh
          ./gen-sdk.sh ${{ matrix.target }}

      - name: Configure Meson for ${{ matrix.target }}
        run: |
          CROSS_FILE="$HOME/x-tools/${{ matrix.triplet }}/meson-crosscompile.txt"

          test -f "$CROSS_FILE"

          meson setup \
            --cross-file "$CROSS_FILE" \
            build-${{ matrix.target }}

      - name: Compile
        run: |
          meson compile -C build-${{ matrix.target }}

      - name: Collect binaries
        run: |
          for NAME in screensaver_shield cover_extract; do
            BINARY="$(find build-${{ matrix.target }} \
              -type f \
              -name "$NAME" \
              -perm -111 \
              -print \
              -quit)"

            if [ -z "$BINARY" ]; then
              echo "$NAME was not produced"
              exit 1
            fi

            cp "$BINARY" "dist/$NAME"
          done

      - name: Inspect binaries
        run: |
          for NAME in screensaver_shield cover_extract; do
            echo "=== $NAME: file ==="
            file "dist/$NAME"

            echo
            echo "=== $NAME: interpreter ==="
            readelf -l "dist/$NAME" | grep interpreter || true

            echo
            echo "=== $NAME: dynamic dependencies ==="
            readelf -d "dist/$NAME" | grep NEEDED || true
            echo
          done

      - name: Checkout FBInk
        run: |
          git clone \
            https://github.com/NiLuJe/FBInk.git \
            "$RUNNER_TEMP/FBInk"

          git -C "$RUNNER_TEMP/FBInk" \
            checkout ede0a8d0a107768609fde9a68aab5f5c583be398

          git -C "$RUNNER_TEMP/FBInk" \
            submodule update --init --recursive

      - name: Build FBInk for ${{ matrix.target }}
        run: |
          TOOLCHAIN="$HOME/x-tools/${{ matrix.triplet }}/bin/${{ matrix.triplet }}"

          make -C "$RUNNER_TEMP/FBInk" distclean

          make -C "$RUNNER_TEMP/FBInk" \
            strip \
            KINDLE=1 \
            CROSS_TC="$TOOLCHAIN" \
            -j"$(nproc)"

          cp \
            "$RUNNER_TEMP/FBInk/Release/fbink" \
            dist/${{ matrix.fbink_name }}

      - name: Inspect FBInk binary
        run: |
          echo "=== file ==="
          file dist/${{ matrix.fbink_name }}

          echo
          echo "=== ELF header ==="
          readelf -h dist/${{ matrix.fbink_name }}

          echo
          echo "=== interpreter ==="
          readelf -l dist/${{ matrix.fbink_name }} | grep interpreter || true

          echo
          echo "=== dynamic dependencies ==="
          readelf -d dist/${{ matrix.fbink_name }} | grep NEEDED || true

      - name: Record dependency revisions
        run: |
          {
            echo "target=${{ matrix.target }}"
            echo "project_commit=${GITHUB_SHA}"
            echo "toolchain_repo=KindleModding/koxtoolchain"
            echo "toolchain_release=2026.04"
            echo "toolchain_sha256=${{ matrix.toolchain_sha256 }}"
            echo "kindle_sdk_commit=$(git -C "$RUNNER_TEMP/kindle-sdk" rev-parse HEAD)"
            echo "fbink_commit=$(git -C "$RUNNER_TEMP/FBInk" rev-parse HEAD)"
          } | tee dist/build-metadata.txt

      - name: Determine package version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! printf '%s\n' "$GITHUB_REF_NAME" \
              | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
            then
              echo "::error::Unsupported release tag '$GITHUB_REF_NAME'. KPM release tags must use vMAJOR.MINOR.PATCH with three numeric components."
              exit 1
            fi

            VERSION="${GITHUB_REF_NAME#v}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package release artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./scripts/package-zip.sh

          # KPM packages are published for kindlehf only.
          if [ "$TARGET" = "kindlehf" ]; then
            ./scripts/package-kpm.sh
          fi

      - name: Validate release artifacts
        run: |
          unzip -t \
            "release/custom-screensaver-${VERSION}-${{ matrix.target }}.zip"

          if [ "${{ matrix.target }}" != "kindlehf" ]; then
            exit 0
          fi

          ./scripts/validate-kpm.sh \
            "release/custom-screensaver_${VERSION}_kindlehf.kpkg" \
            "$VERSION" \
            release/kpm-repository.json

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-screensaver-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            dist/screensaver_shield
            dist/cover_extract
            dist/${{ matrix.fbink_name }}
            dist/build-metadata.txt
            release/*.zip
            release/*.kpkg
            release/kpm-repository.json

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: custom-screensaver-*
          path: artifact

      - name: Find release files
        run: |
          ZIP="$(find artifact \
            -type f \
            -name 'custom-screensaver-*-kindlehf.zip' \
            -print \
            -quit)"

          if [ -z "$ZIP" ]; then
            echo "Release ZIP not found"
            exit 1
          fi

          KPKG="$(find artifact \
            -type f \
            -name 'custom-screensaver_*_kindlehf.kpkg' \
            -print \
            -quit)"

          if [ -z "$KPKG" ]; then
            echo "Release KPM package not found"
            exit 1
          fi

          REPOSITORY_MANIFEST="$(find artifact \
            -type f \
            -name 'kpm-repository.json' \
            -print \
            -quit)"

          if [ -z "$REPOSITORY_MANIFEST" ]; then
            echo "KPM repository manifest not found"
            exit 1
          fi

          PW2_ZIP="$(find artifact \
            -type f \
            -name 'custom-screensaver-*-kindlepw2.zip' \
            -print \
            -quit)"

          if [ -z "$PW2_ZIP" ]; then
            echo "kindlepw2 release ZIP not found"
            exit 1
          fi

          echo "RELEASE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "RELEASE_PW2_ZIP=$PW2_ZIP" >> "$GITHUB_ENV"
          echo "RELEASE_KPKG=$KPKG" >> "$GITHUB_ENV"
          echo "REPOSITORY_MANIFEST=$REPOSITORY_MANIFEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        run: |
          gh release create \
            "$GITHUB_REF_NAME" \
            "$RELEASE_ZIP" \
            "$RELEASE_PW2_ZIP" \
            "$RELEASE_KPKG" \
            "$REPOSITORY_MANIFEST" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kindle Custom Screensaver ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    name: Deploy KPM repository to GitHub Pages
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: custom-screensaver-kindlehf
          path: artifact

      - name: Prepare GitHub Pages content
        run: |
          REPOSITORY_MANIFEST="$(find artifact \
            -type f \
            -name 'kpm-repository.json' \
            -print \
            -quit)"

          if [ -z "$REPOSITORY_MANIFEST" ]; then
            echo "KPM repository manifest not found"
            exit 1
          fi

          mkdir pages
          cp "$REPOSITORY_MANIFEST" pages/kpm.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
